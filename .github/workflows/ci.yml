name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release artifacts
        shell: pwsh
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: meshlan-${{ github.sha }}
          path: |
            dist/MeshLAN-Nebula-Windows.exe
            dist/meshlan-nebula-server-linux-amd64
            dist/meshlan-nebula-server-linux-arm64
            dist/meshlan-nebula-node-linux-amd64
            dist/meshlan-nebula-node-linux-arm64
            dist/SHA256SUMS.txt
